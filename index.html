    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html,body{background:#14181c;height:100%;margin:0;overflow:hidden}body{touch-action:none;-webkit-user-select:none;user-select:none;color:#cfd8e0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);place-items:center;font-family:Noto Sans TC,system-ui,-apple-system,sans-serif;display:grid}canvas{image-rendering:pixelated;display:block}#game{position:fixed;inset:0}#boot{z-index:70;background:#14181c;place-items:center;transition:opacity .35s;display:grid;position:fixed;inset:0}#boot.gone{opacity:0;pointer-events:none}#boot .inner{text-align:center}#boot .mark{font-size:34px;line-height:1}#boot .name{letter-spacing:.3em;color:#8fa0ad;margin-top:12px;font-size:15px}#boot .sub{letter-spacing:.2em;color:#f0b429;min-height:1em;margin-top:6px;font-size:13px}#boot .bar{background:#e8eef31f;border-radius:2px;width:180px;height:4px;margin:18px auto 0;position:relative;overflow:hidden}#boot-fill{background:#f0b429;border-radius:2px;width:30%;animation:1.1s ease-in-out infinite boot-run;position:absolute;top:0;bottom:0;left:0}#boot.measured #boot-fill{transition:width .2s;animation:none}@keyframes boot-run{0%{left:-30%}to{left:100%}}#boot .hint{color:#8fa0ad;min-height:1.4em;margin-top:14px;font-size:13px}#boot.ready{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:pointer;background:#0e1216db}#boot.ready .bar{display:none}#boot.ready .hint{color:#1f2d3a;letter-spacing:.1em;background:#f0b429;border-radius:10px;margin-top:22px;padding:10px 22px;font-size:15px;font-weight:700;animation:1.6s ease-in-out infinite boot-pulse;display:inline-block}@keyframes boot-pulse{50%{transform:scale(1.05)}}#rotate{z-index:60;text-align:center;background:#14181c;flex-direction:column;justify-content:center;align-items:center;padding:28px;font-size:15px;line-height:1.8;display:none;position:fixed;inset:0}#rotate small{color:#8fa0ad;margin-top:8px;font-size:13px;display:block}#rotate-go{color:#1f2d3a;letter-spacing:.08em;background:#f0b429;border:0;border-radius:10px;margin-top:18px;padding:12px 22px;font:700 15px/1 inherit;display:none}#rotate.can-fs #rotate-go{display:inline-block}@media (max-width:820px) and (orientation:portrait){#rotate{display:flex}}@media (prefers-reduced-motion:reduce){#boot{transition:none}#boot-fill,#boot.ready .hint{animation:none}}</style>

    <div id="game"></div>
    <div id="rotate">

      <button id="rotate-go" type="button">全螢幕並轉成橫向</button>

    </div>
